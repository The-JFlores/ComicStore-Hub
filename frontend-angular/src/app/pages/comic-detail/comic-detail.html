<div *ngIf="comic; else loading" class="detail-container">

  <div class="image-section">
    <img 
      [src]="'http://localhost/comicstore_hub/uploads/' + comic.cover_image"
      [alt]="comic.title"
    />
  </div>

  <div class="info-section">
    <h2>{{ comic.title }}</h2>

    <p><strong>Author:</strong> {{ comic.author }}</p>
    <p><strong>Publisher:</strong> {{ comic.publisher }}</p>
    <p><strong>Genre:</strong> {{ comic.genreName }}</p>

    <p class="price">${{ comic.price }}</p>

    <p>{{ comic.description }}</p>

    <button class="buy-btn" (click)="addToCart()">
      Add to Cart
    </button>
  </div>

</div>

<!-- 🔥 LOADING -->
<ng-template #loading>
  <p>Loading comic...</p>
</ng-template>
