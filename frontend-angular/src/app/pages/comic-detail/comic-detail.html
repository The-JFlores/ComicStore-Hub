<!-- 🔥 LOADING -->
<div *ngIf="!comic">
  <p>Loading comic...</p>
</div>

<!-- 🔥 DETAIL -->
<div class="detail-container" *ngIf="comic">

  <div class="detail-card">

    <div class="image-section">
      <img 
        [src]="'http://localhost/comicstore_hub/uploads/' + comic.cover_image"
        [alt]="comic.title"
      />
    </div>

    <div class="info-section">
      <h1>{{ comic.title }}</h1>
      <p class="author">by {{ comic.author }}</p>
      <p class="publisher">{{ comic.publisher }}</p>
      <p class="price">${{ comic.price }}</p>
      <p class="description">{{ comic.description }}</p>

      <button class="buy-btn" (click)="addToCart()">
        Add to Cart
      </button>
    </div>

  </div>

</div>
