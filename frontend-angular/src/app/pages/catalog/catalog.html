

<!-- CATALOG -->
<div class="catalog-container">

  <div 
    *ngFor="let comic of comics"
    class="comic-card"
    (click)="goToDetail(comic.comicID!)"
  >

    <img
      class="comic-image"
      [src]="'http://localhost/comicstore_hub/uploads/' + comic.cover_image"
      [alt]="comic.title"
    />

    <div class="comic-info">
      <h3>{{ comic.title }}</h3>
      <p>{{ comic.author }}</p>
      <p class="price">${{ comic.price }}</p>

      <button 
        class="cart-btn"
        (click)="addToCart(comic); $event.stopPropagation()"
      >
        Add to Cart
      </button>
    </div>

  </div>

</div>
