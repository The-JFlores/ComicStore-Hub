

<div class="cart-container">

  <h2>Your Cart</h2>

  <div *ngIf="items.length === 0">
    <p>Your cart is empty</p>
  </div>

  <div *ngFor="let item of items; let i = index" class="cart-item">

    <img
  class="cart-image"
  [src]="'http://localhost/comicstore_hub/uploads/' + item.cover_image"
  [alt]="item.title"
/>

    <div class="info">
      <h3>{{ item.title }}</h3>
      <p>${{ item.price }}</p>
    </div>

    <button class="remove-btn" (click)="remove(i)">
      Remove
    </button>

  </div>

  <div class="total" *ngIf="items.length > 0">
    <h3>Total: ${{ total.toFixed(2) }}</h3>

    <button class="clear-btn" (click)="clearCart()">
      Clear Cart
    </button>
  </div>

</div>
