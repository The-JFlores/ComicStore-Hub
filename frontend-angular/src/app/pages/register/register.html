<div class="register-container">

  <div class="register-card">
    <h2>Create Account</h2>
    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Enter your name"
      />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
      />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
      />
    </div>
    <button
  class="register-btn"
  (click)="register()"
>
  Register
</button>

    <p
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </p>

    <p
      class="success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </p>
  </div>
</div>
