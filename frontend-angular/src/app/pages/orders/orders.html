
<div class="orders-container">

  <h2>My Orders</h2>

  <p
    class="error-message"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </p>

  <div
    *ngIf="orders.length === 0"
    class="empty-message"
  >
    No orders found.
  </div>

  <div
    *ngFor="let order of orders"
    class="order-card"
  >

    <h3>
      Order #{{ order.orderID }}
    </h3>

    <p>
      Total:
      ${{ order.total }}
    </p>

    <p>
      Date:
      {{ order.created_at }}
    </p>

  </div>

</div>
